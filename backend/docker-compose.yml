services:
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  web:
    build: .
    command: gunicorn goldtrace.wsgi:application --bind 0.0.0.0:8000 --workers 4
    env_file: .env
    ports: ["8000:8000"]
    depends_on: [redis]

  worker:
    build: .
    command: celery -A goldtrace worker -l info
    env_file: .env
    depends_on: [redis]

# MongoDB is provided by MongoDB Atlas (set MONGODB_URI in .env).
# For a fully local stack, add a `mongo:7` service and point MONGODB_URI at it.
