services:
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  backend:
    build: ./backend
    command: gunicorn goldtrace.wsgi:application --bind 0.0.0.0:8000 --workers 4
    env_file: ./backend/.env
    ports: ["8000:8000"]
    depends_on: [redis]
  worker:
    build: ./backend
    command: celery -A goldtrace worker -l info
    env_file: ./backend/.env
    depends_on: [redis]
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000/api/v1
    ports: ["5173:80"]
    depends_on: [backend]
# MongoDB Atlas provides the database (set MONGODB_URI in backend/.env).
# The mobile app (Expo) runs via `npm --prefix mobile start`, not in compose.
